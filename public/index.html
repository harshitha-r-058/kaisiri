<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaisiri — Eco-Friendly Living</title>
  <meta name="description" content="Kaisiri — Shop sustainable, eco-friendly products that are good for you and the planet." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

  <!-- ── NAVBAR ─────────────────────────────────────────────────────────── -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="/" class="nav-logo" data-link="/">
        <span class="logo-leaf">🌿</span>
        <span class="logo-text">Kaisiri</span>
      </a>

      <div class="nav-search">
        <input type="text" id="searchInput" placeholder="Search eco products…" autocomplete="off" />
        <button class="search-btn" id="searchBtn" aria-label="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </button>
      </div>

      <div class="nav-actions">
        <a href="/wishlist" class="nav-icon-btn" data-link="/wishlist" aria-label="Wishlist">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </a>
        <a href="/cart" class="nav-icon-btn cart-btn" data-link="/cart" aria-label="Cart">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <div class="nav-user" id="navUser">
          <button class="btn btn-outline btn-sm" id="loginBtn" data-link="/login">Sign In</button>
          <button class="btn btn-primary btn-sm" id="registerBtn" data-link="/register">Join</button>
        </div>
        <div class="nav-user-menu hidden" id="navUserMenu">
          <button class="user-avatar-btn" id="userAvatarBtn" aria-label="User menu">
            <span id="userInitial">U</span>
          </button>
          <div class="user-dropdown" id="userDropdown">
            <div class="dropdown-header">
              <span id="dropdownName">User</span>
              <span class="eco-points" id="dropdownPoints">🌱 0 pts</span>
            </div>
            <a href="/orders" data-link="/orders">My Orders</a>
            <a href="/wishlist" data-link="/wishlist">Wishlist</a>
            <a href="/profile" data-link="/profile">Profile</a>
            <a href="/seller" data-link="/seller" id="sellerLink" class="hidden">Seller Dashboard</a>
            <a href="/admin" data-link="/admin" id="adminLink" class="hidden">Admin Panel</a>
            <button id="logoutBtn" class="dropdown-logout">Sign Out</button>
          </div>
        </div>
      </div>

      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>

    <!-- Mobile nav -->
    <div class="mobile-nav" id="mobileNav">
      <a href="/" data-link="/">Home</a>
      <a href="/products" data-link="/products">Shop</a>
      <a href="/cart" data-link="/cart">Cart</a>
      <a href="/wishlist" data-link="/wishlist">Wishlist</a>
      <a href="/orders" data-link="/orders">Orders</a>
    </div>
  </nav>

  <!-- ── MAIN APP ────────────────────────────────────────────────────────── -->
  <main id="app"></main>

  <!-- ── TOAST ──────────────────────────────────────────────────────────── -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ── MODAL ──────────────────────────────────────────────────────────── -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/pages/home.js"></script>
  <script src="/js/pages/products.js"></script>
  <script src="/js/pages/product-detail.js"></script>
  <script src="/js/pages/cart-page.js"></script>
  <script src="/js/pages/checkout.js"></script>
  <script src="/js/pages/orders.js"></script>
  <script src="/js/pages/wishlist.js"></script>
  <script src="/js/pages/auth-pages.js"></script>
  <script src="/js/pages/admin.js"></script>
  <script src="/js/pages/profile.js"></script>
  <script src="/js/pages/seller.js"></script>
  <script src="/js/pages/seller-auth.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
